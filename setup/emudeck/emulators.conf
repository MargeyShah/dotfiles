# EmuDeck cross-device save layout — emulator definitions.
#
# One line per emulator, parsed by emudeck-crossdevice-saves.sh:
#
#   emu|target_rel|from_paths|config_edits|options
#
#   emu          emulator id; also the folder under <Emulation>/saves/
#   target_rel   physical folder under <Emulation>/saves/ that holds the saves
#   from_paths   ';'-separated paths that must resolve to the target (they
#                become symlinks). Use ${EMU_ROOT} and ${HOME}. This is normally
#                an emulator-side dir, but may also be a stale alias under
#                saves/ (see the Dolphin row). '-' or empty = no symlinks
#                (config-driven only).
#   config_edits ';'-separated "configfile=key" entries; the key is set to the
#                target path (config backed up). '-' or empty = none.
#   options      'win_priority' -> keep existing target data (e.g. Windows is
#                authoritative); any real dir found at from_paths is archived
#                instead of merged. Otherwise merged newest-wins.
#
# How to add a new emulator:
#   - saves live at a fixed emulator-internal path (like yuzu's nand/user/save)
#     -> add a row with from_paths = that path.
#   - saves are configurable (config file key) -> add a row with config_edits.
#   - both -> both.
# See emudeck.md for the full explanation and Windows-side notes.

# --- Switch (yuzu-family): saves live inside the emulator's nand ------------
# Eden: Windows save tree is authoritative (win_priority).
eden|eden/saves|${EMU_ROOT}/storage/eden/nand/user/save|-|win_priority
eden|eden/profiles|${EMU_ROOT}/storage/eden/nand/system/save/8000000000000010/su/avators|-|win_priority
citron|citron/saves|${EMU_ROOT}/storage/citron/nand/user/save|-|-
citron|citron/profiles|${EMU_ROOT}/storage/citron/nand/system/save/8000000000000010/su/avators|-|-

# --- Dolphin: the emulator resolves GC / Wii / StateSaves under its user dir ---
# Both the Flatpak user dir and the native/AppImage user dir are covered, so it
# is safe whether Dolphin is installed as Flatpak, AppImage or native.
# Windows EmuDeck writes Dolphin savestates to saves/dolphin/states, so that is
# the canonical NAS folder. The emulator-side directory stays "StateSaves"; the
# last from_path collapses any stale saves/dolphin/StateSaves left by an older
# layout into the same target.
dolphin|dolphin/GC|${HOME}/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/GC;${HOME}/.local/share/dolphin-emu/GC|-|-
dolphin|dolphin/Wii|${HOME}/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/Wii;${HOME}/.local/share/dolphin-emu/Wii|-|-
dolphin|dolphin/states|${HOME}/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/StateSaves;${HOME}/.local/share/dolphin-emu/StateSaves;${EMU_ROOT}/saves/dolphin/StateSaves|-|-

# --- Cemu: saves are inside the mlc01 tree (mlc_path is config-driven) ------
cemu|Cemu/saves|${EMU_ROOT}/roms/wiiu/mlc01/usr/save|-|-

# --- Vita3K: whole console under the storage pref; savedata redirected ------
# ux0/app (installed games) is shared game storage; mirror the Windows symlink
# from roms/psvita/InstalledGames to storage/Vita3K/ux0/app.
Vita3K|Vita3K/saves|${EMU_ROOT}/storage/Vita3K/ux0/user/00/savedata|-|-|ux0/app|${EMU_ROOT}/roms/psvita/InstalledGames|-

# --- PPSSPP: memstick (SAVEDATA + PPSSPP_STATE) lives in the emulator's PSP dir ---
# Covers Flatpak AND native/AppImage locations.
ppsspp|ppsspp/saves|${HOME}/.var/app/org.ppsspp.PPSSPP/config/ppsspp/PSP/SAVEDATA;${HOME}/.config/ppsspp/PSP/SAVEDATA;${HOME}/.local/share/ppsspp/PSP/SAVEDATA|-|-
ppsspp|ppsspp/states|${HOME}/.var/app/org.ppsspp.PPSSPP/config/ppsspp/PSP/PPSSPP_STATE;${HOME}/.config/ppsspp/PSP/PPSSPP_STATE;${HOME}/.local/share/ppsspp/PSP/PPSSPP_STATE|-|-

# --- RPCS3: dev_hdd0 lives in storage; savedata + trophy redirected ----------
# dev_hdd0 (installed games) is SHARED game storage on the NAS so both OSes
# install games once. vfs.yml is enforced on the native + flatpak config paths.
rpcs3|rpcs3/saves|${EMU_ROOT}/storage/rpcs3/dev_hdd0/home/00000001/savedata|-|-|dev_hdd0|${HOME}/.config/rpcs3/dev_hdd0;${HOME}/.var/app/net.rpcs3.RPCS3/config/rpcs3/dev_hdd0|${HOME}/.config/rpcs3/vfs.yml=/dev_hdd0/;${HOME}/.var/app/net.rpcs3.RPCS3/config/rpcs3/vfs.yml=/dev_hdd0/
rpcs3|rpcs3/trophy|${EMU_ROOT}/storage/rpcs3/dev_hdd0/home/00000001/trophy|-|-|-|-|-

# --- Config-driven emulators: enforce the config keys point at savesPath -----
# Multiple config files = multiple install variants (Flatpak + native/AppImage).
# from_paths also covers EmuDeck's inverted saves/<emu> -> local-dir symlinks, so
# the data is moved to the NAS and the local dir is linked back to it.
retroarch|retroarch/saves|${HOME}/.var/app/org.libretro.RetroArch/config/retroarch/saves;${HOME}/.config/retroarch/saves|${HOME}/.var/app/org.libretro.RetroArch/config/retroarch/retroarch.cfg=savefile_directory;${HOME}/.config/retroarch/retroarch.cfg=savefile_directory|-
retroarch|retroarch/states|${HOME}/.var/app/org.libretro.RetroArch/config/retroarch/states;${HOME}/.config/retroarch/states|${HOME}/.var/app/org.libretro.RetroArch/config/retroarch/retroarch.cfg=savestate_directory;${HOME}/.config/retroarch/retroarch.cfg=savestate_directory|-
pcsx2|pcsx2/saves|${HOME}/.var/app/net.pcsx2.PCSX2/config/PCSX2/memcards;${HOME}/.config/PCSX2/memcards|${HOME}/.config/PCSX2/inis/PCSX2.ini=MemoryCards;${HOME}/.var/app/net.pcsx2.PCSX2/config/PCSX2/inis/PCSX2.ini=MemoryCards|-
pcsx2|pcsx2/states|${HOME}/.var/app/net.pcsx2.PCSX2/config/PCSX2/sstates;${HOME}/.config/PCSX2/sstates|${HOME}/.config/PCSX2/inis/PCSX2.ini=Savestates;${HOME}/.var/app/net.pcsx2.PCSX2/config/PCSX2/inis/PCSX2.ini=Savestates|-
mgba|mgba/saves|-|${HOME}/.config/mgba/config.ini=savegamePath;${HOME}/.var/app/io.mgba.mGBA/config/mgba/config.ini=savegamePath|-
mgba|mgba/states|-|${HOME}/.config/mgba/config.ini=savestatePath;${HOME}/.var/app/io.mgba.mGBA/config/mgba/config.ini=savestatePath|-

# --- DuckStation: EmuDeck sets the config keys, the engine keeps the physical
#     memcards/savestates dirs on the NAS (both AppImage and old Flatpak paths).
duckstation|duckstation/saves|${HOME}/.local/share/duckstation/memcards;${HOME}/.var/app/org.duckstation.DuckStation/config/duckstation/memcards|-|-
duckstation|duckstation/states|${HOME}/.local/share/duckstation/savestates;${HOME}/.var/app/org.duckstation.DuckStation/config/duckstation/savestates|-|-

# --- melonDS: config-driven; enforce the same keys EmuDeck sets --------------
melonds|melonds/saves|-|${HOME}/.var/app/net.kuribo64.melonDS/config/melonDS/melonDS.ini=SaveFilePath;${HOME}/.config/melonDS/melonDS.ini=SaveFilePath|-
melonds|melonds/states|-|${HOME}/.var/app/net.kuribo64.melonDS/config/melonDS/melonDS.ini=SavestatePath;${HOME}/.config/melonDS/melonDS.ini=SavestatePath|-

# --- ShadPS4: saves are inside the user data dir ----------------------------
shadps4|shadps4/saves|${HOME}/.local/share/shadPS4/savedata|-|-

# --- Xenia: legacy Linux keeps content under roms/xbox360/content; native
#     Xenia stores it under ~/.local/share/Xenia/content. Windows points its
#     emulator dir at saves/xenia/saves.
xenia|xenia/saves|${EMU_ROOT}/roms/xbox360/content;${HOME}/.local/share/Xenia/content|-|-
