# Distrobox assembler definition for the Bazzite terminal toolchain.
# Create with:
#   distrobox assemble create --file setup/bazzite/distrobox.ini
# (or `ujust distrobox-assemble` and pick it up from ~/.distrobox).
#
# The container shares the host $HOME, so the dotfiles symlinked by
# dotfile_config() (zsh, kitty, nvim) are visible here automatically.

[bazzite-ubuntu]
image=ubuntu:24.04
pull=true
init=false
# CLI glue that must exist before container_provision.sh sources lib.sh and
# installs the rest of the toolchain via the shared framework.
additional_packages="sudo curl wget git ca-certificates unzip"
